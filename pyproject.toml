[project]
name = "address-classification-service"
version = "0.1.0"
description = "HTTP service for identifying the country an address belongs to"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "D100",  # missing docstring in public module (covered by script-level docstrings)
    "D104",  # missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"data-processing/scripts/*.py" = [
    "T201",  # allow print() in analysis scripts
    "D103",  # missing docstring in public function (scripts use main())
]

[tool.pytest.ini_options]
testpaths = ["tests"]
